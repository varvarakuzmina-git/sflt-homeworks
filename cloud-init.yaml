#cloud-config
write_files:
  - path: /var/www/html/index.html
    content: |
      <html>
        <head>
          <title>Welcome to Nginx!</title>
        </head>
        <body>
          <h1>Hello from VM!</h1>
          <p>This page is served by Nginx on a virtual machine.</p>
        </body>
      </html>
runcmd:
  - apt-get update
  - apt-get install -y nginx
  - systemctl start nginx
  - systemctl enable nginx